<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Template Area</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            width: 100vw;
            height: 100vh;
        }
        .container{
            width: 100%;
            height: 100%;
            display: grid;
            gap:1rem;
            padding: 4rem;
            background-color: rgb(123, 115, 115);
            grid-template-areas: 
                "header header header"
                "sidebar content1 content1"
                "sidebar content2 content3"
                "footer footer footer"
            ;
        }
        .items{
            background-color: greenyellow;
            padding:1rem;
            display: flex;
            border: 5px solid black;
            color: black;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: 700;
        }
        #header{
            grid-area: header;
        }
        #sidebar{
            grid-area: sidebar;
        }
        #content1{
            grid-area: content1;
        }
        #content2{
            grid-area: content2;
        }
        #content3{
            grid-area: content3;
        }
        #footer{
            grid-area: footer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items" id="header">Header</div>
        <div class="items" id="sidebar">Sidebar</div>
        <div class="items" id="content1">Conten1</div>
        <div class="items" id="content2">Conten2</div>
        <div class="items" id="content3">Conten3</div>
        <div class="items" id="footer">Footer</div>
    </div>
</body>
</html>

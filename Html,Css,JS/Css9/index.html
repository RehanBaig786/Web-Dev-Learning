<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transition</title>
    <style>
        .main{
            height: 90vh;
            width: 90vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            height: 400px;
            width: 400px;
            background-color: bisque;
            border: 1px solid black;
            border-radius: 50%;
            transition-property: all;
            transition-duration: 3s;
            /* transition-delay: 1s; */
            transition-timing-function: ease-in;
            box-shadow: 5px 5px 5px blue, -5px -5px 5px green;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container p{
            font-size: 45px;
            /* visibility: hidden; */
            opacity: 0;
            transition: opacity 1s;
            transition-delay: 3s;
        }
        .container:hover p {
            opacity: 1;
            transform: rotate(-180deg) ;
        }
        .container:hover{
            height: 90%;
            width: 90%;
            border-radius: 0%;
            background-color:aqua;
            transform: rotate(180deg) translate(-50px)  skew(45deg);
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="container">
            <p>Hello BHADKHU...</p>
        </div>
    </div>
    
</body>
</html>

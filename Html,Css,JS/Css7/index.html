<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            flex-direction: row;
            border: 1px solid  black;
            background-color: bisque;
            width: 450px;
            margin: 10px;
            padding: 2px;
        }
        #box1{
            background-color: aquamarine;
            border: 1px solid brown;
            width: 47%;
            margin: 3px;
            padding: 2px;
            display: flex;
            flex-direction: column;
        }
        #box2{
            background-color: yellow;
            border: 1px solid blue;
            width: 47%;
            margin: 3px;
            padding: 2px;
        }
        p{
            border: 1px solid red;
        }
        @media (max-width:640px){
            .container{
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="box1">
            <p>text1</p>
            <p>text2</p>
        </div>
        <div id="box2">
            <img src="i-am-ironman-4k-35.jpg" alt="Ironman Image" height="200px" width="200px">
        </div>
    </div>
</body>
</html>

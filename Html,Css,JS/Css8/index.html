<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            height: 100vh;
            width: 100vw;
            background-color: bisque;
            border: 5px solid black;
        }
        .box{
            height: 75px;
            width: 300px;
            background-color: aqua;
            border: 2px solid black;
            border-radius: 10px;
            margin: 10px;
            position: relative;
            /* animation-name: rightMovement;
            animation-duration: 5s; */
            /* animation-delay: 2s; */
            /* animation-iteration-count: 1; */
            /* animation-timing-function: cubic-bezier(1, -0.4, 1, 1); */
            /* animation-timing-function: linear;
            animation-direction: alternate;
            animation-fill-mode:forwards; */
            /* @keyframes duration | easing-function | delay |
            iteration-count | direction | fill-mode | play-state | name */
            animation: 5s linear 1s infinite alternate none running rightMovement;
        }
        @keyframes rightMovement {
            from  {
                top:0;
                left:0;
            }

            to{
                top: 0;
                left: 1200px;
            }
            
        }
        #box2{
            height: 75px;
            width: 300px;
            background-color: aqua;
            border: 2px solid black;
            border-radius: 10px;
            margin: 10px;
            position: relative;
            animation: 5s ease-in 1s infinite alternate none running leftMovement;
        }
        @keyframes leftMovement {
            from  {
                top: 450px;
                left:1200px;
            }

            to{
                top: 450px;
                left: 0;
            }
            
        }
        .circle{
            height: 70px;
            width: 70px;
            background-color: red;
            border: 2px solid black;
            border-radius: 10px;
            margin: 10px;
            position: relative;
            border-radius: 50%;
            top: 150px;
            left: 720px;
            animation: 5s ease-in-out 0s infinite alternate none running circleMovement;
        }
        @keyframes circleMovement {
           0% {
                top: 0px;
                left: 10px;
            }
            30%{
                top: 5px;
                left: 750px;
            }
            60%{
                top: 450px;
                left: 1100px;
            }
            100%{
                top: 200px;
                left: 700px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">

        </div>
        <div class="circle"></div>
        <div id="box2">

        </div>
        
    </div>
</body>
</html>

<!-- animation:duration||timing function || delay || iteration count || direction || fill mode || play suit||  name -->
